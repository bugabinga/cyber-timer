[package]
name = "cyber-timer"
version = "0.1.0"
edition = "2021"
description = "A blazing fast cyberpunk-themed terminal timer"
readme = "README.md"
license = "MIT"
authors = ["bugabinga"]
repository = "https://github.com/bugabinga/cyber-timer"
keywords = ["timer", "terminal", "cyberpunk", "cli"]
categories = ["command-line-utilities"]

[dev-dependencies]
insta = "1"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
env_logger = "0.10"
log = "0.4"
notify-rust = "4"
ratatui = "0.27"
regex = "1.10"
rodio = "0.19"
thiserror = "1.0"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 2
